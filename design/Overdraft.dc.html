<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Familjen+Grotesk:wght@400;500&family=Martian+Mono:wght@300;400;500&display=swap">
  <style>
    :root{
      --paper:#F3F0E7; --sunk:#E9E5D9;
      --ink:#17150F; --ink2:#5B5648; --ink3:#8E8877; --rule:#D5CFBF;
      --sea:#2B4A7E; --flare:#A2541F;
      --d:'Instrument Serif',Georgia,'Times New Roman',serif;
      --u:'Familjen Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
      --m:'Martian Mono',ui-monospace,Menlo,'SF Mono',monospace;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--u);-webkit-font-smoothing:antialiased}
    a{color:var(--ink2);text-decoration:none} a:hover{color:var(--ink)}
    .lab{font-family:var(--m);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3)}
    .mn{font-family:var(--m);font-variant-numeric:tabular-nums}
    button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
    .btn{height:30px;padding:0 14px;border:1px solid var(--rule);font-family:var(--m);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);transition:background .15s,color .15s,border-color .15s}
    .btn:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
    .step{transition:opacity .55s ease,transform .55s cubic-bezier(.22,1,.36,1)}
    .code{transition:color .7s ease}
    .spine{transition:height .6s cubic-bezier(.22,1,.36,1)}
  </style>
</helmet>

<div style="min-height: 900px; width: 100%; background: var(--paper); display: flex; flex-direction: column">

  <div style="height: 58px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 64px; border-bottom: 1px solid var(--ink)">
    <div style="display: flex; align-items: baseline; gap: 10px">
      <span style="font-family: var(--d); font-size: 25px; letter-spacing: -.015em">float</span>
      <span style="display: block; width: 26px; height: 3px; background: var(--sea); margin-bottom: 5px"></span>
    </div>
    <button class="btn" onClick="{{v.replay}}">Replay</button>
  </div>

  <div style="display: flex; flex-grow: 1; align-items: stretch">

    <div style="width: 640px; flex: none; border-right: 1px solid var(--ink); padding: 68px 64px; display: flex; flex-direction: column">
      <span class="code" style="font-family: var(--d); font-size: 252px; line-height: .76; letter-spacing: -.055em; color: {{v.codeColor}}">{{v.code}}</span>
      <div style="font-family: var(--d); font-size: 48px; line-height: 1.05; margin-top: 24px; color: {{v.codeColor}}">{{v.codeWord}}</div>

      <div class="mn" style="font-size: 11px; line-height: 2.2; color: var(--ink2); margin-top: 38px; border-top: 1px solid var(--ink); padding-top: 18px">
        <div>GET /v1/premium/quote</div>
        <div>x-payment: <span style="color: {{v.headerColor}}">{{v.header}}</span></div>
      </div>

      <div style="margin-top: auto; padding-top: 34px">
        <div style="font-family: var(--d); font-size: 34px; line-height: 1.18">{{v.verdict}}</div>
      </div>
    </div>

    <div style="flex-grow: 1; padding: 68px 64px; display: flex; flex-direction: column; justify-content: center">
      <div class="lab" style="margin-bottom: 38px">What Float did about it</div>

      <div style="position: relative; padding-left: 42px">
        <div style="position: absolute; left: 11px; top: 10px; width: 1px; background: var(--rule); height: 340px"></div>
        <div class="spine" style="position: absolute; left: 11px; top: 10px; width: 1px; background: var(--sea); height: {{v.spineH}}"></div>

        <sc-for list="{{v.steps}}" as="s" hint-placeholder-count="3">
          <div class="step" style="position: relative; opacity: {{s.op}}; transform: {{s.tf}}; margin-bottom: 46px">
            <div style="position: absolute; left: -36px; top: 5px; width: 9px; height: 9px; border-radius: 50%; border: 1px solid {{s.dot}}; background: {{s.dotFill}}"></div>
            <div style="font-family: var(--d); font-size: 30px; line-height: 1.2; max-width: 22ch">{{s.line}}</div>
            <div class="mn" style="font-size: 10px; color: var(--ink3); margin-top: 9px">{{s.meta}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0 };
    this.timers = [];
  }

  componentDidMount() { this.play(); }
  componentWillUnmount() { this.clear(); }
  clear() { this.timers.forEach(clearTimeout); this.timers = []; }

  play() {
    this.clear();
    this.setState({ step: 0 });
    [600, 1500, 2500].forEach((ms, i) => {
      this.timers.push(setTimeout(() => this.setState({ step: i + 1 }), ms));
    });
  }

  renderVals() {
    const n = this.state.step;
    const done = n >= 3;

    const rows = [
      { line: 'Scout’s wallet holds $0.0000.', meta: 'Arc testnet USDC · short by $0.0100' },
      { line: 'Float advances a cent against the human who vouched for it.', meta: 'human 0x71c4…9ab2 · World Selfie verified' },
      { line: 'The x402 header is signed and the resource comes back.', meta: 'tx 0x4c1f…a903 · owed $0.0101 incl. origination' },
    ];

    return {
      v: {
        code: done ? '200' : '402',
        codeWord: done ? 'OK' : 'Payment Required',
        codeColor: done ? '#2B4A7E' : '#A2541F',
        header: done ? 'signed by float · $0.0100 usdc' : 'absent',
        headerColor: done ? '#2B4A7E' : '#A2541F',
        verdict: done ? 'The agent never stopped.' : 'The agent is broke.',
        spineH: (n * 118) + 'px',
        steps: rows.map((r, i) => {
          const on = n >= i + 1;
          return {
            line: r.line,
            meta: r.meta,
            op: on ? '1' : '0.15',
            tf: on ? 'translateY(0)' : 'translateY(10px)',
            dot: on ? (i === 1 ? '#A2541F' : '#2B4A7E') : '#D5CFBF',
            dotFill: on ? (i === 1 ? '#A2541F' : '#2B4A7E') : 'transparent',
          };
        }),
        replay: () => this.play(),
      },
    };
  }
}
</script>
</body>
</html>
