"""
Float Standardized Subgraph Schema
Historical credit, accounting, and indexing layer for Float Credit Facilities on Arc.
"""

enum ProfileStatus {
  INACTIVE
  ACTIVE
  SUSPENDED
  DEFAULTED
}

enum FundingSource {
  AGENT_GATEWAY
  FLOAT_FACILITY
}

type Facility @entity {
  id: ID!
  totalProfiles: BigInt!
  totalDrawdowns: BigInt!
  totalRepayments: BigInt!
  totalVolumeBorrowed: BigInt!
  totalVolumeRepaid: BigInt!
  totalOutstandingExposure: BigInt!
  lastActivityTimestamp: BigInt!
}

type HumanCreditProfile @entity {
  id: ID! # bytes32 profileId
  humanOwner: Bytes!
  humanRoot: Bytes!
  creditLimit: BigInt!
  outstandingDebt: BigInt!
  totalBorrowed: BigInt!
  totalRepaid: BigInt!
  creditUtilizationBps: BigInt!
  status: ProfileStatus!
  createdAt: BigInt!
  agents: [Agent!]! @derivedFrom(field: "humanProfile")
  drawdowns: [Drawdown!]! @derivedFrom(field: "humanProfile")
  repayments: [Repayment!]! @derivedFrom(field: "humanProfile")
  payments: [Payment!]! @derivedFrom(field: "humanProfile")
  defaults: [DefaultRecord!]! @derivedFrom(field: "humanProfile")
}

type Agent @entity {
  id: ID! # agent address hex
  agentAddress: Bytes!
  humanProfile: HumanCreditProfile!
  isActive: Boolean!
  authorizedAt: BigInt!
  drawdowns: [Drawdown!]! @derivedFrom(field: "agent")
  repayments: [Repayment!]! @derivedFrom(field: "beneficiaryAgent")
  payments: [Payment!]! @derivedFrom(field: "agent")
}

type Drawdown @entity(immutable: true) {
  id: ID! # loanId
  humanProfile: HumanCreditProfile!
  agent: Agent!
  amount: BigInt!
  outstandingDebtAfter: BigInt!
  paymentReference: String!
  timestamp: BigInt!
  transactionHash: Bytes!
}

type Repayment @entity(immutable: true) {
  id: ID! # repaymentId
  humanProfile: HumanCreditProfile!
  payer: Bytes!
  beneficiaryAgent: Agent
  amount: BigInt!
  remainingDebt: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

type Payment @entity(immutable: true) {
  id: ID! # paymentId
  agent: Agent!
  humanProfile: HumanCreditProfile!
  sellerAddress: Bytes!
  resourceUrl: String!
  amount: BigInt!
  fundingSource: FundingSource!
  drawdown: Drawdown
  timestamp: BigInt!
}

type DefaultRecord @entity(immutable: true) {
  id: ID! # txHash + profileId
  humanProfile: HumanCreditProfile!
  outstandingDebt: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}
