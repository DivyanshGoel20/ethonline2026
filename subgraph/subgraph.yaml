specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: FloatCreditFacility
    network: arc-testnet
    source:
      address: "0xAa2d23bAC7b6f9b4ca2737252F924b3F485E0686"
      abi: FloatCreditFacility
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Facility
        - HumanCreditProfile
        - Agent
        - Drawdown
        - Repayment
        - Payment
        - DefaultRecord
      abis:
        - name: FloatCreditFacility
          file: ../contracts/out/FloatCreditFacility.sol/FloatCreditFacility.json
      eventHandlers:
        - event: CreditProfileCreated(indexed bytes32,indexed address,bytes32,uint256)
          handler: handleCreditProfileCreated
        - event: CreditLimitUpdated(indexed bytes32,uint256,uint256)
          handler: handleCreditLimitUpdated
        - event: ProfileStatusChanged(indexed bytes32,uint8)
          handler: handleProfileStatusChanged
        - event: AgentAuthorized(indexed bytes32,indexed address,uint256)
          handler: handleAgentAuthorized
        - event: AgentRevoked(indexed bytes32,indexed address,uint256)
          handler: handleAgentRevoked
        - event: DrawdownRecorded(indexed uint256,indexed bytes32,indexed address,uint256,uint256,uint256,string)
          handler: handleDrawdownRecorded
        - event: RepaymentRecorded(indexed uint256,indexed bytes32,indexed address,address,uint256,uint256,uint256)
          handler: handleRepaymentRecorded
        - event: DefaultMarked(indexed bytes32,uint256,uint256)
          handler: handleDefaultMarked
      file: ./src/mapping.ts
